<div class="container">
  <div class="left-container">
    <img ngSrc="../../../../assets/imgs/keros_artwork_3.png" alt="register" height="880" width="610"
         priority="high">
  </div>
  <div class="right-container">
    <p class="title-one">Registrieren</p>
    <p class="text-one">
      Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut.
    </p>
    <form [formGroup]="form">
      <div class="name-container">
        <mat-form-field>
          <mat-label>Vorname</mat-label>
          <input matInput type="text" formControlName="firstName">
        </mat-form-field>

        <mat-form-field>
          <mat-label>Nachname</mat-label>
          <input matInput type="text" formControlName="lastName">
        </mat-form-field>
      </div>

      <mat-form-field>
        <mat-label>E-Mail</mat-label>
        <input type="email" matInput placeholder="example@example.com" formControlName="email">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Passwort</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password"/>
        <button
          mat-icon-button
          matSuffix
          (click)="showOrHidePassword($event)"
          [attr.aria-label]="'Hide password'"
          [attr.aria-pressed]="hide()">
          <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>
    </form>
    <button mat-stroked-button class="button-one" (click)="onFormSubmitted()" [disabled]="false">
      Registrieren
    </button>
  </div>
</div>
