<div class="container">
  <div class="left-container">
    <img src="../../../../assets/images/login_register_image.jpg" alt="artwork-card">
  </div>
  <div class="right-container">
    <div class="inner-login-container">
      <p class="title-one">{{ 'login.title' | translate }}</p>
      <p class="text-one-grey">
        {{ 'login.description' | translate }}
      </p>
      <form [formGroup]="form">
        <mat-form-field>
          <mat-label>{{ 'login.email.label' | translate }}</mat-label>
          <input matInput
                 type="email"
                 name="username"
                 placeholder="{{ 'login.email.placeholder' | translate }}"
                 formControlName="email"/>
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ 'login.password.label' | translate }}</mat-label>
          <input matInput
                 type="password"
                 name="password"
                 autocomplete="on"
                 [type]="hide() ? 'password' : 'text'"
                 formControlName="password"/>
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="showOrHidePassword($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide()">
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </form>
      <span class="error-message">{{ backendErrorMessage | errorMessageHandler }}</span>
      <button mat-stroked-button class="button-one-inverted" (click)="onFormSubmitted()"
              [disabled]="disableLoginButton">
        {{ 'login.button.submit' | translate }}
      </button>
    </div>
    <div class="inner-register-container">
      <p class="text-one">{{ 'login.no.account' | translate }}
        <span class="register-link" routerLink="/registrieren">{{ 'login.register.link' | translate }}</span>
      </p>
    </div>
  </div>
</div>
