<div class="first-section">
  <p class="title-one">Mein Profil</p>
  <button mat-stroked-button class="button-one upper-case" (click)="this.logout()">Abmelden</button>
</div>
<div class="second-section">
  @if (userFromParent) {
    <mat-tab-group [disableRipple]="true">
      <mat-tab label="Persönliche Daten">
          <app-personal-data [userFromParent]="userFromParent"></app-personal-data>
      </mat-tab>
      <mat-tab label="Angefragte Kunstwerke">
        <app-requested-artworks [userFromParent]="userFromParent"></app-requested-artworks>
      </mat-tab>
      <mat-tab label="Favorisierte Kunstwerke">
        <app-favorite-artworks [userFromParent]="userFromParent"></app-favorite-artworks>
      </mat-tab>
    </mat-tab-group>
  }
</div>
