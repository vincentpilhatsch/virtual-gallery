<div class="first-section">
  <p class="title-one">Mein Profil</p>
  <button mat-stroked-button class="button-one">Abmelden</button>
</div>
<div class="second-section">
  <mat-tab-group>
    <mat-tab label="Persönliche Daten">
      <form>
        <div class="first-form-container">
          <mat-form-field>
            <mat-label>Vorname</mat-label>
            <input matInput type="text">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Nachname</mat-label>
            <input matInput type="text">
          </mat-form-field>
        </div>

        <div class="second-form-container">
          <mat-form-field>
            <mat-label>E-Mail</mat-label>
            <input type="email" matInput placeholder="example@example.com">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Telefon</mat-label>
            <input matInput type="text">
          </mat-form-field>
        </div>
        <div class="third-form-container">
          <mat-form-field>
            <mat-label>Wohnort</mat-label>
            <input matInput type="text">
          </mat-form-field>
        </div>
      </form>
      <button mat-stroked-button class="button-one">Daten speichern</button>
    </mat-tab>
    <mat-tab label="Second"></mat-tab>
    <mat-tab label="Third"></mat-tab>
  </mat-tab-group>
</div>
