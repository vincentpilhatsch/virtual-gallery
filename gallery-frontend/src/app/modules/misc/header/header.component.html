<div class="bar">
  <div class="left-container">
    <div class="header-container">
      <p class="header-title" routerLink="/home">OLIVER KEROS</p>
    </div>
  </div>
  <div class="middle-container">
    <div class="header-container">
      <p class="header-text" routerLink="/" routerLinkActive="active-link">Ausstellungen</p>
    </div>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    <div class="header-container">
      <p class="header-text" routerLink="/kunstwerke" routerLinkActive="active-link">Kunstwerke</p>
    </div>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    <div class="header-container">
      <p class="header-text" routerLink="/künstler" routerLinkActive="active-link">Künstler</p>
    </div>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    <div class="header-container">
      <p class="header-text" routerLink="/events" routerLinkActive="active-link">Events</p>
    </div>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    <div class="header-container">
      <p class="header-text" routerLink="/" routerLinkActive="active-link">Virtuelle Tour</p>
    </div>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    <div class="header-container">
      <p class="header-text dashboard" routerLink="/dashboard" routerLinkActive="active-link">Dashboard</p>
    </div>
  </div>
  <div class="right-container">
    <mat-form-field>
      <mat-select [(ngModel)]="selectedLanguage" (selectionChange)="onSelectChange($event)">
        @for (language of languageArray; track language) {
          <mat-option [value]="language">{{ language }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <p class="centered-dot">
      <span class="dot"></span>
    </p>
    @if (userService.user) {
      <div class="header-container">
        <div class="bar-icons">
          <mat-icon fontIcon="notifications"></mat-icon>
          <mat-icon fontIcon="account_circle" routerLink="/profil"></mat-icon>
        </div>
      </div>
    } @else {
      <button mat-stroked-button class="button-one" routerLink="/anmelden">Anmelden</button>
    }
  </div>
</div>
