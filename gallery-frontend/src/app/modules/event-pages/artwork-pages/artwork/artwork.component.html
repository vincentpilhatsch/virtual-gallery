<div class="first-section">
  <div class="left-container">
    <img ngSrc="../../../../assets/imgs/keros_artwork_2.png" alt="artwork" height="880" width="610"
         priority="high">
  </div>
  <div class="right-container">
    <div class="title-container">
      <p class="title-two">Titel des Kunstwerkes</p>
      <app-favorite-icon></app-favorite-icon>
    </div>
    <mat-list>
      <mat-list-item>
        <div class="item-content">
          <span>Preis</span>
          <span>2.350€</span>
        </div>
      </mat-list-item>
      <mat-divider></mat-divider>
      <mat-list-item>
        <div class="item-content">
          <span>Abmessung</span>
          <span>165cm x 210cm</span>
        </div>
      </mat-list-item>
      <mat-divider></mat-divider>
      <mat-list-item>
        <div class="item-content">
          <span>Entstehungsjahr</span>
          <span>2023</span>
        </div>
      </mat-list-item>
      <mat-divider></mat-divider>
      <mat-list-item>
        <div class="item-content">
          <span>Technik</span>
          <span>Acryl und Öl auf Leinwand</span>
        </div>
      </mat-list-item>
    </mat-list>
    <button mat-stroked-button class="button-one" [routerLink]="['/kunstwerk-anfragen']">Anfrage stellen</button>
  </div>
</div>
<div class="divider"></div>
<div class="second-section">
  <p class="title-two">Andere Kunstwerke</p>
  <div class="inner-artwork-container">
    <app-artwork-card></app-artwork-card>
    <app-artwork-card></app-artwork-card>
  </div>
  <div class="inner-artwork-container">
    <app-artwork-card></app-artwork-card>
    <app-artwork-card></app-artwork-card>
  </div>
</div>
