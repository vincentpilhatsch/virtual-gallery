@if (artwork) {
  <div class="card">
    <div class="image-container" (click)="handleCardClick()">
      @if (artwork.sold) {
        <div class="sold-container">
          <span class="sold-text">Verkauft</span>
        </div>
      }
      <img src="data:image/jpeg;base64,{{ artwork.image }}" alt="artwork-card" loading="lazy">
    </div>
    <div class="text-container">
      <div class="first-text-container">
        <p class="title">{{ artwork.title }}</p>
        <p class="price">{{ artwork.price | moneyConverter }}</p>
      </div>
      <div class="second-text-container">
        <!-- Show favorite-icon only if user is logged in -> favoriteArtworksIds are present -->
        @if (favoriteArtworkIds) {
          <app-favorite-icon [artworkId]="artwork.id" [isFavorite]="isFavorite"></app-favorite-icon>
        }
      </div>
    </div>
  </div>
}
