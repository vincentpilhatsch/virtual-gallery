<p class="title-one">Ausstellung hinzufügen</p>
<div class="artwork-container">
  <div class="first-section">
    <app-image-upload
      [file]="file"
      [entity]="exhibition"
      [manageMode]="manageMode"
      (fileChange)="onFileChange($event)">
    </app-image-upload>
  </div>
  <form class="second-section" [formGroup]="form">
    <mat-form-field>
      <mat-label>Titel</mat-label>
      <input matInput
             type="text"
             formControlName="title">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Beschreibung</mat-label>
      <input matInput
             type="text"
             formControlName="description">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Standort</mat-label>
      <input matInput
             type="text"
             formControlName="location">
    </mat-form-field>
    <div class="inner-form-container">
      <!--      <mat-form-field>-->
      <!--        <mat-label>Startdatum</mat-label>-->
      <!--        <input matInput [matDatepicker]="startPicker" formControlName="startDate">-->
      <!--        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>-->
      <!--        <mat-datepicker #startPicker></mat-datepicker>-->
      <!--      </mat-form-field>-->
      <!--      <mat-form-field>-->
      <!--        <mat-label>Startdatum</mat-label>-->
      <!--        <input matInput [matDatepicker]="endPicker" formControlName="endDate">-->
      <!--        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>-->
      <!--        <mat-datepicker #endPicker></mat-datepicker>-->
      <!--      </mat-form-field>-->
      <mat-form-field>
        <mat-label>Startdatum</mat-label>
        <input matInput
               type="text"
               placeholder="Bsp: 01.01.2001"
               formControlName="startDate">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Enddatum</mat-label>
        <input matInput
               type="text"
               placeholder="Format: 01.01.2001"
               formControlName="endDate">
      </mat-form-field>
    </div>
    <!-- Buttons -->
    <div class="inner-form-container">
      @if (manageMode === ManageModesEnum.EDIT) {
        <button type="button"
                mat-stroked-button
                class="button-one" (click)="onDelete()">
          Ausstellung Löschen
        </button>
        <button type="button"
                mat-stroked-button
                class="button-one-inverted"
                [disabled]="disableCreateButton"
                (click)="onCreate()">
          Ausstellung aktualisieren
        </button>
      } @else {
        <button type="button"
                mat-stroked-button
                class="button-one-inverted"
                [disabled]="disableCreateButton"
                (click)="onCreate()">
          Ausstellung hinzufügen
        </button>
      }
    </div>
  </form>
</div>
