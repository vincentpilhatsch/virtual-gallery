<p class="title-one">Ausstellung hinzufügen</p>
<div class="artwork-container">
  <div class="first-section">
    <app-image-upload
      [file]="file"
      [entity]="exhibition"
      [manageMode]="manageMode"
      (fileChange)="onFileChange($event)">
    </app-image-upload>
  </div>
  <form class="second-section" [formGroup]="form">
    <mat-form-field>
      <mat-label>Titel</mat-label>
      <input matInput
             type="text"
             formControlName="title">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Technik</mat-label>
      <input matInput
             type="text"
             formControlName="technic">
    </mat-form-field>
    <div class="inner-form-container">
      <mat-form-field>
        <mat-label>Breite in Zentimetern</mat-label>
        <input matInput
               type="text"
               formControlName="width">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Höhe in Zentimetern</mat-label>
        <input matInput
               type="text"
               formControlName="height">
      </mat-form-field>
    </div>
    <div class="inner-form-container">
      <mat-form-field>
        <mat-label>Erstellungsjahr</mat-label>
        <input matInput
               type="text"
               formControlName="yearOfCreation">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Preis in Euro</mat-label>
        <input matInput
               type="text"
               formControlName="price">
      </mat-form-field>
    </div>
    <!-- Checkboxes -->
    <div class="inner-form-container">
      <mat-checkbox formControlName="sold">
        <p class="text-one">Verkauft</p>
      </mat-checkbox>
      @if (manageMode === ManageModesEnum.ADD) {
        <mat-checkbox>
          <p class="text-one">Benutzer benachrichten</p>
        </mat-checkbox>
      }
    </div>
    <!-- Buttons -->
    <div class="inner-form-container">
      @if (manageMode === ManageModesEnum.EDIT) {
        <button type="button"
                mat-stroked-button
                class="button-one-inverted" (click)="onDelete()">
          Kunstwerk Löschen
        </button>
        <button type="button"
                mat-stroked-button
                class="button-one-inverted"
                [disabled]="disableCreateButton"
                (click)="onCreate()">
          Kunstwerk aktualisieren
        </button>
      } @else {
        <button type="button"
                mat-stroked-button
                class="button-one-inverted"
                [disabled]="disableCreateButton"
                (click)="onCreate()">
          Kunstwerk hinzufügen
        </button>
      }
    </div>
  </form>
</div>
