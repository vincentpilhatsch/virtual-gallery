<p class="title-one">Kunstwerk hinzufügen</p>
<div class="artwork-container">
  <div class="first-section">
    @if (manageMode === ManageModesEnum.ADD) {
      <img src="./assets/imgs/keros_artwork_2.png" alt="artwork-card">
    } @else {
      <img src="data:image/jpeg;base64,{{ artwork?.image }}" alt="artwork-card">
    }
  </div>
  <form class="second-section" [formGroup]="form">
    <mat-form-field>
      <mat-label>Titel</mat-label>
      <input matInput
             type="text"
             formControlName="title">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Technik</mat-label>
      <input matInput
             type="text"
             formControlName="technic">
    </mat-form-field>
    <div class="inner-form-container">
      <mat-form-field>
        <mat-label>Breite in Metern</mat-label>
        <input matInput
               type="text"
               formControlName="width">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Höhe in Metern</mat-label>
        <input matInput
               type="text"
               formControlName="height">
      </mat-form-field>
    </div>
    <div class="inner-form-container">
      <mat-form-field>
        <mat-label>Erstellungsjahr</mat-label>
        <input matInput
               type="text"
               formControlName="yearOfCreation">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Preis in Euro</mat-label>
        <input matInput
               type="text"
               formControlName="price">
      </mat-form-field>
    </div>
    <mat-checkbox formControlName="sold">
      <p class="text-one">Verkauft</p>
    </mat-checkbox>
    @if (manageMode === ManageModesEnum.ADD) {
      <mat-checkbox>
        <p class="text-one">Benutzer benachrichten</p>
      </mat-checkbox>
    }
    <input type="file" (change)="onFileSelected($event)">
    <!--    [disabled]="disableLoginButton"-->
    <button mat-stroked-button
            class="button-one"

            (click)="onSubmit()">
      Kunstwerk hinzufügen
    </button>
  </form>
</div>
