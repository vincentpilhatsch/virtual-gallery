@defer {
  <p class="title-one">Kunstwerk hinzufügen</p>
  <div class="artwork-container">
    <div class="first-section">
      <app-image-upload
        [file]="file"
        [entity]="artwork"
        [manageMode]="manageMode"
        (fileChange)="onFileChange($event)">
      </app-image-upload>
    </div>
    <form class="second-section" [formGroup]="form">
      <mat-form-field>
        <mat-label>Titel</mat-label>
        <input matInput
               type="text"
               formControlName="title">
      </mat-form-field>
      <mat-form-field>
        <mat-label>Technik</mat-label>
        <input matInput
               type="text"
               formControlName="technic">
      </mat-form-field>
      <div class="inner-form-container">
        <mat-form-field>
          <mat-label>Breite in Zentimetern</mat-label>
          <input matInput
                 type="text"
                 placeholder="Bsp: 120"
                 formControlName="width">
        </mat-form-field>
        <mat-form-field>
          <mat-label>Höhe in Zentimetern</mat-label>
          <input matInput
                 type="text"
                 placeholder="Bsp: 180"
                 formControlName="height">
        </mat-form-field>
      </div>
      <div class="inner-form-container">
        <mat-form-field>
          <mat-label>Erstellungsjahr</mat-label>
          <input matInput
                 type="text"
                 placeholder="Bsp: 2019"
                 formControlName="yearOfCreation">
        </mat-form-field>
        <mat-form-field>
          <mat-label>Preis in Euro</mat-label>
          <input matInput
                 type="text"
                 placeholder="Bsp: 2450"
                 formControlName="price">
        </mat-form-field>
      </div>
      <!-- Checkboxes -->
      <div class="inner-form-container">
        <mat-checkbox formControlName="sold">
          <p class="text-one">Kunstwerk verkauft</p>
        </mat-checkbox>

      </div>
      <!-- Buttons -->
      <div class="inner-form-container">
        @if (manageMode === ManageModesEnum.EDIT) {
          <button type="button"
                  mat-stroked-button
                  class="button-one" (click)="onDelete()">
            Kunstwerk Löschen
          </button>
          <button type="button"
                  mat-stroked-button
                  class="button-one-inverted"
                  [disabled]="disableCreateButton"
                  (click)="onCreateOrUpdate()">
            Kunstwerk aktualisieren
          </button>
        } @else {
          <button type="button"
                  mat-stroked-button
                  class="button-one-inverted"
                  [disabled]="disableCreateButton"
                  (click)="onCreateOrUpdate()">
            Kunstwerk hinzufügen
          </button>
        }
      </div>
    </form>
  </div>
} @placeholder (minimum 200ms) {
  <div class="spinner-container">
    <mat-spinner></mat-spinner>
  </div>
}
