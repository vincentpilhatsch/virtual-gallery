<p class="title-one">Event ankündigen</p>
<div class="artwork-container">
  <div class="first-section">
    <img src="./assets/imgs/keros_artwork_2.png" alt="artwork-card">
  </div>
  <form class="second-section" [formGroup]="form">
    <mat-form-field>
      <mat-label>Titel</mat-label>
      <input matInput
             type="text"
             formControlName="title">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Datum</mat-label>
      <input
        matInput
        type="text"
        formControlName="date">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Standort</mat-label>
      <input
        matInput
        type="text"
        formControlName="location">
    </mat-form-field>
    <mat-form-field>
      <mat-label>Beschreibung</mat-label>
      <textarea matInput
                rows="5"
                formControlName="description"></textarea>
    </mat-form-field>
    <mat-checkbox formControlName="notification">
      <p class="text-one">Benutzer benachrichtigen</p>
    </mat-checkbox>
    <button mat-stroked-button class="button-one">Ankündigen</button>
  </form>
</div>
